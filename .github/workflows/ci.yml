name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check (app)
        run: npx tsc --noEmit

      - name: Type check (E2E tests)
        run: pnpm run typecheck:e2e

      - name: Production build
        run: pnpm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npx playwright test tests/homepage.spec.ts tests/navigation.spec.ts tests/experience.spec.ts tests/projects.spec.ts tests/external-links.spec.ts tests/responsive.spec.ts

      - name: Accessibility validation
        run: npx playwright test tests/accessibility.spec.ts

      - name: Link validation
        run: npx playwright test tests/link-integrity.spec.ts

      - name: Lighthouse CI
        run: pnpm run lighthouse

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14
